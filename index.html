<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX1 RC WORKS // Tactical Lab Terminal</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #0d1117;
            --accent-cyan: #00f0ff;
            --accent-red: #ff3b30;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .header {
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-cyan);
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 13px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1xl;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-left: 3px solid var(--accent-cyan);
        }

        .info-item {
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            border-radius: 4px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-cyan);
            color: var(--bg-primary);
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #00d8e6;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-success {
            background-color: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .status-error {
            background-color: rgba(255, 59, 48, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="header">
        <h1>GX1 RC WORKS // TACTICAL LAB</h1>
        <p>SECURE SUBMISSION NETWORK v4.0 // INFRASTRUCTURE LIVE</p>
    </div>

    <div class="info-grid">
        <div class="info-item">// <strong>LAB PARAMETERS:</strong> Abu Ftaira, Kuwait</div>
        <div class="info-item">// <strong>WORKFLOW CONDITIONS:</strong> System teardowns log parameters straight into the GX1 global database tracking node.</div>
    </div>

    <form id="repairForm">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="e.g. Abdullah">
            </div>
            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">WhatsApp / Phone Number</label>
                <input type="text" id="phone" required placeholder="e.g. +965 9999 9999">
            </div>
            <div class="form-group">
                <label for="vehicle">RC Vehicle Model Details</label>
                <input type="text" id="vehicle" required placeholder="e.g. Traxxas Slash 4x4 / Custom Jet Plane">
            </div>
        </div>

        <div class="form-group">
            <label for="details">Comprehensive Manifest of System Failures</label>
            <textarea id="details" required placeholder="Describe stripping issues, mechanical lockups, burnt ESC, stripped gears, structural cracks..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Transmit Repair Order Log</button>
    </form>

    <div id="statusBanner" class="status-msg"></div>

    <div class="footer">
        GX1 RC WORKS // AUTOMATED LOGGING PIPELINE // NO OUTSIDE REDIRECTS
    </div>
</div>

<script>
    // YOUR LIVE GOOGLE APPS SCRIPT DATABASE ENDPOINT
    const GOOGLE_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxZv7ZIol8pgfEeH_Hl8ClZqP4YSKjKPe_bykXPkWDla8leUncpWmzHGANPGaTSvPzZ/exec";

    document.getElementById('repairForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusBanner = document.getElementById('statusBanner');
        
        // Update UI to show submission in progress
        submitBtn.disabled = true;
        submitBtn.innerText = "TRANSMITTING DATA STREAM...";
        statusBanner.style.display = "none";

        // Package form values cleanly matching JSON parser properties
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            vehicle: document.getElementById('vehicle').value,
            details: document.getElementById('details').value
        };

        // Fire text payload directly to Google's cloud server engine
        fetch(GOOGLE_SCRIPT_API_URL, {
            method: 'POST',
            mode: 'no-cors', // Bypasses browser cross-origin preflight locks safely
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            // Because no-cors doesn't return readable status text, a successful handshake defaults here
            statusBanner.className = "status-msg status-success";
            statusBanner.innerText = "TRANSMISSION SUCCESSFUL! LOG DATA WRITTEN TO GX1_DATABASE.";
            statusBanner.style.display = "block";
            
            // Clear inputs for the next customer entry
            document.getElementById('repairForm').reset();
        })
        .catch((error) => {
            statusBanner.className = "status-msg status-error";
            statusBanner.innerText = "CRITICAL SEND FAILURE: CONNECTIVITY TIMEOUT OR MALFORMED PIPELINE.";
            statusBanner.style.display = "block";
            console.error('Data pipeline error:', error);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Transmit Repair Order Log";
        });
    });
</script>

</body>
</html>
